{% if messages %}
<div id="messages-container" class="fixed top-4 right-4 z-50 flex flex-col gap-3 w-[min(92vw,22rem)]">

  {% for message in messages %}
    <div class="message-toast group flex items-start gap-3 p-4 rounded-xl shadow-lg ring-1 ring-black/5 backdrop-blur-sm text-white
      {% if message.tags == 'success' %} bg-emerald-600/95
      {% elif message.tags == 'warning' %} bg-amber-500/95
      {% elif message.tags == 'error' %}   bg-rose-600/95
      {% elif message.tags == 'info' %}    bg-sky-600/95
      {% else %}                           bg-stone-600/95
      {% endif %}
      opacity-0 translate-x-4 transition-all duration-300 ease-out"
      role="alert">

      <!-- Icon -->
      <div class="shrink-0 mt-0.5">
        {% if message.tags == 'success' %}
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        {% elif message.tags == 'warning' %}
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
          </svg>
        {% elif message.tags == 'error' %}
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        {% elif message.tags == 'info' %}
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
          </svg>
        {% else %}
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        {% endif %}
      </div>

      <!-- Message text -->
      <p class="flex-1 text-sm font-medium leading-snug">{{ message }}</p>

      <!-- Close button -->
      <button type="button"
              onclick="dismissMessage(this.closest('.message-toast'))"
              class="shrink-0 -mr-1 -mt-1 p-1 rounded-md text-white/70 hover:text-white hover:bg-white/10 transition"
              aria-label="Dismiss">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  {% endfor %}

</div>

<script>
  (function () {
    const AUTO_DISMISS_MS = 3000;
    const FADE_MS = 300;

    // Fade + slide in on mount
    function show(el) {
      requestAnimationFrame(() => {
        el.classList.remove('opacity-0', 'translate-x-4');
      });
    }

    // Fade out, then remove from DOM
    function dismiss(el) {
      if (!el || el.dataset.dismissing === '1') return;
      el.dataset.dismissing = '1';
      el.classList.add('opacity-0', 'translate-x-4');
      setTimeout(() => el.remove(), FADE_MS);
    }

    // Expose for inline onclick
    window.dismissMessage = dismiss;

    // Initialize all toasts
    document.querySelectorAll('.message-toast').forEach((el) => {
      show(el);

      // Auto-dismiss timer
      const timer = setTimeout(() => dismiss(el), AUTO_DISMISS_MS);

      // Pause on hover, resume on leave
      el.addEventListener('mouseenter', () => clearTimeout(timer));
      el.addEventListener('mouseleave', () => {
        if (el.dataset.dismissing !== '1') {
          setTimeout(() => dismiss(el), 1000);
        }
      });
    });
  })();
</script>
{% endif %}
