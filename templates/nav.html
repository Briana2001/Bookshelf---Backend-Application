{% load static %}

<header class="bg-white/80 backdrop-blur-sm border-b border-stone-200/80 sticky top-0 z-20 shadow-sm">
    <div class="max-w-7xl mx-auto px-5 sm:px-8 flex items-center justify-between h-16 md:h-20">
      <!-- logo + brand -->
      <a href="#" class="flex items-center gap-2.5 shrink-0">
        <!-- clean book / bookshelf icon -->
        <img src="{% static 'images/logo.png' %}" alt="Bookshelf Icon" class="w-7 h-7 md:w-8 md:h-8">
        <span class="font-semibold text-lg md:text-xl tracking-tight text-stone-800">Bookshelf</span>
      </a>

      <!-- desktop navigation + actions -->
      <nav class="hidden md:flex items-center gap-1 lg:gap-2">
        <!-- main links -->
        <ul class="flex items-center gap-1 mr-4 lg:mr-6">
          <li>
            <a href="{% url "shelf:home" %}" class="nav-link flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium text-stone-700 hover:text-amber-800 hover:bg-stone-100/70">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
              </svg>
              Home
            </a>
          </li>
          <li>
            <a href="{% url "shelf:books" %}" class="nav-link flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium text-stone-700 hover:text-amber-800 hover:bg-stone-100/70">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
              </svg>
              Books
            </a>
          </li>
          <li>
            <a href="{% url "shelf:book_add" %}" class="nav-link flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium text-stone-700 hover:text-amber-800 hover:bg-stone-100/70">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
              </svg>
              Add book
            </a>
          </li>
        </ul>

        <!-- user / auth actions -->
        <div class="flex items-center gap-2 pl-2 border-l border-stone-200">
          <!-- login (ghost) -->
          <button class="btn flex items-center gap-1.5 px-3.5 py-2 text-sm font-medium text-stone-700 rounded-lg hover:bg-stone-100/80 hover:text-amber-800">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>
            Login
          </button>
          <!-- get started (primary) -->
          <button class="btn flex items-center gap-1.5 px-3.5 py-2 text-sm font-semibold text-white bg-amber-700 rounded-lg shadow-sm hover:bg-amber-800 hover:shadow">
            Get Started
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
            </svg>
          </button>
          <!-- sample welcome user (hidden on small) + logout icon -->
          <div class="flex items-center gap-1 ml-1">
            <span class="hidden lg:flex items-center gap-1.5 text-xs font-medium text-stone-500 bg-stone-100 px-3 py-1.5 rounded-full">
              <svg class="w-3.5 h-3.5 text-amber-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
              </svg>
              welcome, reader
            </span>
            <button class="btn p-2 rounded-lg text-stone-500 hover:text-amber-800 hover:bg-stone-100" title="Logout">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
              </svg>
            </button>
          </div>
        </div>
      </nav>

      <!-- mobile menu button (only UI, no JS) -->
      <button class="md:hidden p-2 rounded-lg text-stone-600 hover:bg-stone-100">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>
    </div>
  </header>
